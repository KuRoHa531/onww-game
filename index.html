<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual">
<title>ワンナイト人狼 〜混沌に潜みし狼達〜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="moon-glow" aria-hidden="true"></div>
  <button id="fs-btn" class="fs-btn" aria-label="全画面" title="全画面" onclick="ONW.ui.toggleFullscreen()">□</button>

  <header class="onw-header">
    <div class="onw-header__phase" id="phase-label">支度中</div>
    <h1 class="onw-header__title">
      <span class="onw-header__title-sub">ONE NIGHT WEREWOLF</span>
      混沌に潜みし狼達
    </h1>
    <div class="onw-header__day" id="day-clock">――</div>
  </header>

  <p class="wiki-link" style="text-align:center; margin: 0 0 -10px;">
    <a href="https://kuroha531.github.io/ONWW-wiki/" target="_blank" rel="noopener" style="color: var(--gold-dim); font-size: 13px; text-decoration: underline;">→ 役職辞典を見る</a>
  </p>

  <!-- ゲーム中ずっと出ているカードのテーブル（js/stage.js が管理。#app の再描画では消えない） -->
  <div id="table" class="tb-wrap" aria-label="カードのテーブル"></div>

  <main id="app" class="onw-app">
    <!-- 各フェーズの画面は js/ui.js が動的に描画する -->
    <p class="onw-loading">読み込み中…</p>
  </main>

  <footer class="onw-footer">
    <span id="footer-note">v0.2 オンライン対応(β)</span>
  </footer>

  <!-- 依存順に読み込み（モジュールは使わず、ONW名前空間に集約） -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <!-- アカウント機能（Supabase）。js/config.js が空ならゲストプレイだけが動く -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/config.js"></script>
  <script src="js/account.js"></script>
  <script src="js/friends.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/png.js"></script>
  <script src="js/net.js"></script>
  <script src="js/roles.js"></script>
  <script src="js/cpu.js"></script>
  <script src="js/night.js"></script>
  <script src="js/vote.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/stage.js"></script>
  <script src="js/account-ui.js"></script>
  <script src="js/co.js"></script>
  <script src="js/debug.js"></script>
  <script>
    /* スマホのキーボードで画面の高さが縮んでも、レイアウトをずらさない: --app-h に「キーボードが無い時の高さ」を保持する */
    (function () {
      let w = window.innerWidth, h = window.innerHeight;
      const set = () => document.documentElement.style.setProperty("--app-h", h + "px");
      set();
      window.addEventListener("resize", function () {
        if (window.innerWidth !== w || window.innerHeight > h) { w = window.innerWidth; h = window.innerHeight; set(); }   // 向きの変更・キーボードが閉じた時だけ更新
      });
    })();
  </script>
  <script src="js/main.js"></script>
</body>
</html>
