  // Safe alert polyfill for iframe environments
  (function() {
    var rawAlert = window.alert;
    window.alert = function(msg) {
      try {
        if (typeof rawAlert === 'function') {
          rawAlert(msg);
          return;
        }
      } catch (e) {
        // Ignored if blocked in iframe
      }
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(20,20,30,0.95);color:#fff;padding:12px 20px;border-radius:8px;box-shadow:0 10px 25px rgba(0,0,0,0.6);z-index:999999;font-size:14px;max-width:90vw;text-align:center;border:1px solid rgba(255,255,255,0.2);backdrop-filter:blur(8px);';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(function() {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      }, 4000);
    };
  })();
</script>

  <script>
    /* スマホのキーボードで画面の高さが縮んでも、レイアウトをずらさない: --app-h に「キーボードが無い時の高さ」を保持する */
    (function () {
      let w = window.innerWidth, h = window.innerHeight;
      const set = () => document.documentElement.style.setProperty("--app-h", h + "px");
      set();
      window.addEventListener("resize", function () {
        if (window.innerWidth !== w || window.innerHeight > h) { w = window.innerWidth; h = window.innerHeight; set(); }   // 向きの変更・キーボードが閉じた時だけ更新
      });
      // 全画面(□)を入る/戻すときは、画面の高さそのものが変わる。戻したあとも全画面のときの高さのままだと、下の欄(変化公開・CO状況)が画面の外に押し出されるので、切り替えのたびに今の高さに取り直す
      const refit = function () {
        [0, 150, 400].forEach(function (ms) { setTimeout(function () { w = window.innerWidth; h = window.innerHeight; set(); if (window.ONW && ONW.ui && ONW.ui.fitBoard) ONW.ui.fitBoard(); }, ms); });
      };
      document.addEventListener("fullscreenchange", refit);
      document.addEventListener("webkitfullscreenchange", refit);
    })();
  </script>
